<svg xmlns="http://www.w3.org/2000/svg" width="499" height="370" viewBox="0 0 499 370" role="img" aria-label="失败突破（假突破）：突破等高点后收回区间，看跌信号 K 进场">
<style>
  .bg { fill: url(#bg); }
