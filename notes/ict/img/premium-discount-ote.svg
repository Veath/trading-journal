  .l-target { stroke: #2a78d6; stroke-dasharray: 6 3; }
  .l-entry { stroke: #0b0b0b; }
  .bracket { stroke: #52514e; fill: none; }
  .grid { stroke: #ecebe7; }
  .tick { font-size: 11px; fill: #8a8984; stroke: none; }
