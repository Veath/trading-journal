  .t-entry rect, .t-accent rect { fill: rgba(212, 145, 34, 0.14); stroke: #c98500; }
  .t-entry text, .t-accent text { fill: #8a5a0e; }
  @media (prefers-color-scheme: dark) {
    .bg-grid { stroke: rgba(110, 160, 230, 0.06); }
