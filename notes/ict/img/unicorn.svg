    .t-target text, .t-bull text { fill: #9fe0a2; }
    .t-entry rect, .t-accent rect { fill: rgba(240, 180, 76, 0.16); stroke: #f0b44c; }
    .t-entry text, .t-accent text { fill: #ffd38a; }
