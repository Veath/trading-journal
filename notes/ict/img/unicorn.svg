  .l-stop { stroke: #c0504d; stroke-dasharray: 6 3; }
  .l-target { stroke: #3e8e41; stroke-dasharray: 6 3; }
  .l-entry { stroke: #2f5fd0; }
  .bracket { stroke: #8a8278; fill: none; }
